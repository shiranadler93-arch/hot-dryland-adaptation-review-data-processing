[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solution_efficiency_scoring"
version = "0.1.0"
description = "scoring solution effectiveness from combination data."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.1.2",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "xlsxwriter>=3.2.9",
    "openpyxl>=3.1.5",
]

[project.scripts]
train-logit-model = "solution_efficiency_scoring.result_reproduction:main"

[tool.setuptools.packages.find]
include = ["solution_efficiency_scoring*"]
